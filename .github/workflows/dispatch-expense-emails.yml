name: Dispatch expense emails

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke expense email worker
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::Configure the APP_URL repository variable and CRON_SECRET repository secret."
            exit 1
          fi

          response_file="${RUNNER_TEMP}/expense-email-worker-response"
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/dispatch-expense-emails")
          cat "$response_file"
          if [[ "$http_status" != "200" ]]; then
            echo "::error::Expense email worker returned HTTP ${http_status}."
            exit 1
          fi
